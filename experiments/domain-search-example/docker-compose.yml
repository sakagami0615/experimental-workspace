services:
  search-service:
    build: .
    volumes:
      - .:/app
    environment:
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-learn.microsoft.com}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      SEARCH_SERVICE_BASE_URL: ${SEARCH_SERVICE_BASE_URL:-http://search-service:8000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-10}
      FETCH_PAGE_LIMIT: ${FETCH_PAGE_LIMIT:-3}
      MAX_CHARS_PER_PAGE: ${MAX_CHARS_PER_PAGE:-4000}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-20}
      UV_LINK_MODE: copy
      UV_PROJECT_ENVIRONMENT: /tmp/domain-search-example-venv
    ports:
      - "8000:8000"
    depends_on:
      - searxng
    extra_hosts:
      - "host.docker.internal:host-gateway"

  searxng:
    image: searxng/searxng:latest
    environment:
      BASE_URL: http://localhost:8080/
      INSTANCE_NAME: domain-search
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8080:8080"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "${OPEN_WEBUI_PORT:-3002}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  open-webui-data:
